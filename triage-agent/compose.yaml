# The local triage-agent stack. `docker compose up -d --wait` returns once
# every service with a health check reports healthy. Needs a .env file with
# POSTGRES_PASSWORD; copy .env.example to start.
#
#   loadgen ──> checkout <── scrape ── prometheus ──> alertmanager ──> agent
#
# Breaking checkout raises its error rate, Prometheus fires CheckoutHigh5xxRate,
# and Alertmanager posts it to the agent's webhook. The agent stores each triage
# in Postgres, on a named volume, so triages survive `docker compose down`.
name: triage

services:
  agent:
    build: .
    image: triage-agent:dev
    environment:
      DATABASE_URL: postgresql://triage:${POSTGRES_PASSWORD:?copy .env.example to .env}@postgres:5432/triage
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Not published to the host: the agent and Adminer reach it on the network.
  postgres:
    image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: triage
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "triage", "-d", "triage"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Web UI for the database: http://localhost:8082, server "postgres", user "triage".
  adminer:
    image: adminer:5.4.1@sha256:a3167350c4eb9ae4473b8ea0f49c8e5ae74c87b240ee2f6086521dba2a6bf243
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    # The image listens on [::] only, which fails on hosts with IPv6 turned off in Docker.
    command: ["php", "-S", "0.0.0.0:8080", "-t", "/var/www/html"]
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Demo service that gets broken on purpose, so there is something to alert on.
  checkout:
    build: demo/checkout
    image: triage-checkout:dev
    ports:
      - "8081:8080"
    restart: unless-stopped

  # Steady traffic, so checkout has an error rate to measure. Same image, other entry point.
  loadgen:
    image: triage-checkout:dev
    command: ["python", "loadgen.py"]
    healthcheck:
      disable: true
    depends_on:
      checkout:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      checkout:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
    # Alertmanager only starts once the agent it delivers to is up.
    depends_on:
      agent:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # Named volume: survives `docker compose down`; `down -v` deletes it.
  pgdata:

networks:
  default:
    name: triage
