name: CI Build App

# Scoped to the CI/CD crash course project, so other projects in this repo don't trigger it.
on:
  push:
    branches: [main]
    paths:
      - 'Github CICD/**'
      - '.github/workflows/ci-build.yaml'
  pull_request:
    paths:
      - 'Github CICD/**'
      - '.github/workflows/ci-build.yaml'

permissions:
  checks: write
  contents: read
  pull-requests: write

env:
  IMAGE_REG: ghcr.io
  IMAGE_REPO: benc-uk/python-demoapp

jobs:
  test:
    name: 'Tests & Linting'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Github CICD
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v2

      # The runner's default Python is now 3.14, which the pinned Werkzeug 2.2.2 can't import.
      - name: 'Set up Python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 'Run linting'
        run: make lint

      - name: 'Run tests'
        if: ${{ !cancelled() }}
        run: make test-report

      - name: 'Upload test results'
        uses: actions/upload-artifact@v4
        # Disabled when running locally with the nektos/act tool
        if: ${{ always() && !env.ACT && hashFiles('Github CICD/test-results.xml') != '' }}
        with:
          name: test-results
          path: Github CICD/test-results.xml

      - name: 'Publish test results'
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ always() && !env.ACT && hashFiles('Github CICD/test-results.xml') != '' }}
        with:
          files: Github CICD/test-results.xml

  build:
    name: 'Build & Push Image'
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Github CICD
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v2

      # Nicer than using github runid, I think, will be picked up automatically by make
      - name: 'Create datestamp image tag'
        run: sudo echo "IMAGE_TAG=$(date +%d-%m-%Y.%H%M)" >> $GITHUB_ENV

      - name: 'Docker build image'
        run: make image

      # Only when pushing to default branch (e.g. master or main), then push image to registry
      - name: 'Push to container registry'
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login $IMAGE_REG -u $GITHUB_ACTOR --password-stdin
          make push

      - name: 'Trigger AKS release pipeline'
        if: github.ref == 'refs/heads/master'
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: 'CD Release - AKS'
          token: ${{ secrets.GH_PAT }}
          inputs: '{ "IMAGE_TAG": "${{ env.IMAGE_TAG }}" }'

      - name: 'Trigger Azure web app release pipeline'
        if: github.ref == 'refs/heads/master'
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: 'CD Release - Webapp'
          token: ${{ secrets.GH_PAT }}
          inputs: '{ "IMAGE_TAG": "${{ env.IMAGE_TAG }}" }'
