# Prometheus for the local stack: scrape checkout, evaluate the alert rules,
# and send firing alerts to Alertmanager.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: checkout
    static_configs:
      - targets: ["checkout:8080"]
